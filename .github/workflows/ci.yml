# Deterministic checks on every pull request (spec 0005, R1 and R2).
#
# Runs `npm run verify` rather than lint and build separately, so CI and a
# developer's local gate are the same command. A check that CI runs but nobody
# can reproduce locally is how green builds and broken checkouts diverge.
#
# `verify` skips the pipeline pilot when `pipeline/raw/` is absent, which is
# always true here, so nothing in this job depends on ILOSTAT or the World Bank
# being up. The numbers are guarded by spec 0004's offline suite, run
# unconditionally in the last step.
#
# Spec 0007 removed the Python setup step. The pipeline is TypeScript run on
# Node 24's native type stripping, with zero runtime dependencies, so Node is
# now the only pinned toolchain here. The interpreter pin was load-bearing while
# it lasted -- Python 3.11 failed the golden master on one WLD value -- and its
# replacement is R1's 100,000 committed differential cases, frozen from 3.13
# before the Python was deleted.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint + build. Exits non-zero on either, and on a moved regression
      # anchor when a cache is present (spec 0003 R2).
      - name: npm run verify
        run: npm run verify

      # Spec 0007 R7. The four deliberately broken snippets in
      # pipeline/tests/schema.types.ts must fail `tsc --noEmit`, and the same
      # case must STOP failing when the `Int` brand is aliased away — a case
      # that errors identically without the brand is not evidence for it.
      # `npm run verify` runs both; the named steps exist so they fail
      # distinguishably from lint on the checks list.
      - name: typecheck
        run: npm run typecheck

      - name: schema brand (R7 two-way check)
        run: npm run check:brand

      # Spec 0004's offline suite — the step that actually guards the numbers.
      # Runs the real pilot against a committed gzipped fixture with the network
      # patched out, so a moved anchor, a changed number format or a reordered
      # column fails here in under a second. Unconditional by design: a guard
      # that skips when the suite is absent is a green tick that is not evidence.
      # Ported to TypeScript by spec 0007 R8, and it now also carries R1's
      # 100,000 differential cases against the interpreter this job no longer
      # installs.
      # Kept as its own named step so it fails distinguishably from lint on the
      # checks list. `npm run verify` also runs it, so local and CI are one gate.
      - name: pipeline tests
        run: npm run test:pipeline

      # Spec 0008's node --test suite. Five of its six files went with the map
      # spec 0010 R1 deletes, so what remains is the lint-config guard: it
      # asserts that the .mjs scripts and suite sit in a lint config block that
      # gives them Node globals. It does NOT guard the tier palette or the app's
      # accessibility structure any more — 0008's AA rule moved to
      # src/styles/contrast.test.js and runs in the js tests step above.
      #
      # `npm run verify` runs this too; the named step exists so it fails
      # distinguishably from lint on the checks list.
      - name: app tests
        run: npm run test:app
