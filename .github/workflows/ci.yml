# Deterministic checks on every pull request (spec 0005, R1).
#
# Runs `npm run verify` rather than lint and build separately, so CI and a
# developer's local gate are the same command. A check that CI runs but nobody
# can reproduce locally is how green builds and broken checkouts diverge.
#
# `verify` skips the pipeline pilot when `pipeline/raw/` is absent, which is
# always true here, so nothing in this job depends on ILOSTAT or the World Bank
# being up. The numbers are guarded by spec 0004's offline suite, which adds one
# unconditional step to this job in #43 — deliberately not stubbed here, because
# a step that passes when the thing it checks is absent is a green tick that is
# not evidence.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The pipeline is stdlib-only, so once 0004's suite runs here (#43) the
      # interpreter version is the ONLY variable in that step. Pinning it now
      # means the step lands in a known environment rather than whatever the
      # runner image happens to ship.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: npm ci

      # lint + build. Exits non-zero on either, and on a moved regression
      # anchor when a cache is present (spec 0003 R2).
      - name: npm run verify
        run: npm run verify
