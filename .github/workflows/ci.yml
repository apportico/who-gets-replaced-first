# Deterministic checks on every pull request (spec 0005, R1 and R2).
#
# Runs `npm run verify` rather than lint and build separately, so CI and a
# developer's local gate are the same command. A check that CI runs but nobody
# can reproduce locally is how green builds and broken checkouts diverge.
#
# `verify` skips the pipeline pilot when `pipeline/raw/` is absent, which is
# always true here, so nothing in this job depends on ILOSTAT or the World Bank
# being up. The numbers are guarded by the offline suite below, not by fetching.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint + build. Exits non-zero on either, and on a moved regression
      # anchor when a cache is present (spec 0003 R2).
      - name: npm run verify
        run: npm run verify

      # The offline pipeline suite (spec 0004 R7) — the step that actually
      # guards the numbers, running the real pilot against a committed fixture
      # with the network patched out.
      #
      # It does not exist until 0004 lands. This WARNS rather than skipping
      # silently: a step that quietly passes when the thing it checks is absent
      # is a green tick that is not evidence, which is exactly the trap
      # `claude-review.yml` fell into. The warning is visible in the run summary,
      # and the step starts enforcing on its own the moment the suite appears.
      - name: pipeline tests
        run: |
          if [ -d pipeline/tests ]; then
            python3 -m unittest discover pipeline/tests -v
          else
            echo "::warning title=Pipeline tests not present::pipeline/tests/ does not exist yet (spec 0004 / issue #2). This job is NOT checking the pipeline. A pass here says nothing about the numbers."
          fi
