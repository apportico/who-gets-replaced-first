name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 0019 R15. THIS STEP MUST STAY ABOVE THE BUILD.
      #
      # It used to run after it. next.config.ts takes `basePath` from
      # PAGES_BASE_PATH (R1), and `steps.setup_pages.outputs.base_path`
      # referenced before this step has run expands to the EMPTY STRING rather
      # than failing. `basePath: ''` is Next's default, so the build stays green
      # while every _next/ asset is emitted at the domain root and the project
      # site 404s its own JavaScript.
      #
      # A grep for the variable name cannot tell a wired base path from an empty
      # one, which is why R15's acceptance checks the built output instead.
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
