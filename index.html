<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Which countries and occupations sit in the work most exposed to AI — from official labour statistics, with proxies and modelled estimates labelled as such."
    />
    <!-- Spec 0015 R4. Absolute URLs, every one of them.

         Probed 2026-09-01: Vite does NOT apply the base path to `meta content`.
         A relative `og:image` ships verbatim into dist/ and resolves to
         https://apportico.github.io/og.png, which is a 404 — the crawler gets
         no image and nothing in the build says so. The `rel="icon"` link above
         IS rewritten to /who-gets-replaced-first/favicon.svg, which is exactly
         what makes the omission easy to miss. scripts/check-meta.mjs asserts
         over the BUILT files for that reason: this defect does not exist in
         source and cannot be seen there.

         What this preview is NOT: the reader's own result. GitHub Pages serves
         a static artefact with no prerender and crawlers do not execute JS, so
         per-result meta cannot be produced on this host by any means. The
         reader gets their own card from the result screen instead (R5). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Who Gets Replaced First" />
    <meta property="og:title" content="Who Gets Replaced First" />
    <meta
      property="og:description"
      content="What the official labour statistics say about your occupation group, in 177 countries. Every figure carries its tier. No replacement date, because none is published."
    />
    <meta property="og:url" content="https://apportico.github.io/who-gets-replaced-first/" />
    <meta property="og:image" content="https://apportico.github.io/who-gets-replaced-first/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Who Gets Replaced First — official labour statistics for 177 countries, every figure carrying its tier." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Who Gets Replaced First" />
    <meta
      name="twitter:description"
      content="What the official labour statistics say about your occupation group, in 177 countries. Every figure carries its tier. No replacement date, because none is published."
    />
    <meta name="twitter:image" content="https://apportico.github.io/who-gets-replaced-first/og.png" />

    <!-- Spec 0010 R2. The three families, requested here rather than through a
         CSS `@import`.

         The @import was in src/styles/index.css and it did not survive the
         build: Tailwind v4's processing drops a bare `@import url(...)`, so the
         emitted dist CSS contained no @import and no @font-face, and the app
         shipped rendering entirely in the fallback stacks. Nothing errored, the
         build was clean, and a test asserting the URL was in the source file
         passed the whole time.

         preconnect first, because the stylesheet and the font files come from
         two different origins and the second request cannot start until the
         first resolves. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>WHO GETS REPLACED FIRST</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
